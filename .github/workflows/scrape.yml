name: Scrape & Deploy

# Triggered externally by cron-job.org every 30 minutes (:07 and :37) through
# the workflow_dispatch API. GitHub's own `schedule` was removed: it ran only
# about 10% of scheduled runs, and keeping both would double up.
on:
  workflow_dispatch:
    inputs:
      allow_big_drop:
        description: 'Allow in-custody to drop by more than 5 people and 10% in one run (only if the drop is real)'
        type: boolean
        default: false

permissions:
  contents: write

# Never run two scrapes at once; a second trigger waits for the first.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ref: main so a run that sat queued starts from the latest data, not
      # the commit that existed when it was triggered.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: npm install

      - name: Run scraper
        run: node scrape.js
        env:
          ALLOW_BIG_DROP: ${{ inputs.allow_big_drop && '1' || '' }}

      - name: Copy data to frontend public
        run: |
          mkdir -p frontend/public/data
          cp data/*.json frontend/public/data/

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      # Runs even when an earlier step failed: a broken frontend build
      # shouldn't throw away scraped data (it did on Sep 25-26). The scraper
      # writes nothing when it fails, so a failed scrape commits nothing.
      # The job still shows red.
      - name: Commit data files
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update data [skip ci]"
          git pull --no-rebase -X ours
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
